# ---------------------------------------------------------------------------
# "Featured Content" cards on the home page, right after the Holy Latin Mass
# schedule. Cards appear in this order. Large cards (type: link or video) come
# first, two to a row; sermons with type: audio follow, three to a row.
#
#   type: link    opens a web page. Needs url. image and button are optional.
#   type: video   a video that plays inside the card. Either a YouTube video:
#                 youtube (the id after "v=" in the address), with an optional
#                 start (in seconds); or a video file kept on this site: file
#                 (an .mp4 in assets/video/) and poster (a picture shown before
#                 it plays). GitHub refuses files over 100 MB, so keep each
#                 video file well under that. Add audio (an .mp3, in
#                 assets/audio/ or a web address) for a "Listen (MP3)" button
#                 under the video.
#   type: audio   an MP3 sermon. Needs url: an .mp3 in assets/audio/ or a web
#                 address.
#
# wide: true makes a large card fill the whole row, picture on the left (useful
# when there is an odd number of large cards).
#
# On the site, always write "Holy Latin Mass", not "Mass" (see README.md).
# ---------------------------------------------------------------------------

