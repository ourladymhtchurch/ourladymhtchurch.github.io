# ---------------------------------------------------------------------------
# "Featured Content" cards on the home page, right after the Holy Latin Mass
# schedule. Cards appear in this order, two to a row.
#
# Sermons are on the Media page (/sermons/): add them to _data/sermons.yml, not here.
#
#   type: sermon  the chapel's most recent sermon video, taken from the top of
#                 videos: in _data/sermons.yml, with "Listen (MP3)" and
#                 "More sermons" buttons. Only label and wide are set here.
#   type: link    opens a web page. Needs url. image and button are optional.
#   type: video   a video that plays inside the card. Either a YouTube video:
#                 youtube (the id after "v=" in the address), with an optional
#                 start (in seconds); or a video file kept on this site: file
#                 (an .mp4 in assets/video/) and poster (a picture shown before
#                 it plays). GitHub refuses files over 100 MB, so keep each
#                 video file well under that. Add audio (an .mp3, in
#                 assets/audio/ or a web address) for a "Listen (MP3)" button
#                 under the video.
#   type: audio   an MP3 card (three to a row, after the others). Needs url.
#                 Sermons belong on the Media page instead (see above).
#
# wide: true makes a large card fill the whole row, picture or video on the left
# (useful when there is an odd number of large cards).
#
# On the site, always write "Holy Latin Mass", not "Mass" (see README.md).
# ---------------------------------------------------------------------------

items:
  # The chapel's most recent sermon: the first video in _data/sermons.yml.
  # Nothing to change here for a new sermon; add its video there instead.
  - type: sermon
    wide: true
    label: "Sermon"

  # The chapel's sermon for the 24th Sunday after Pentecost on its YouTube channel
  # (uploaded 2026-11-19 through the YouTube pipeline; added here at the user's
  # request the same day).
  - type: video
    wide: true
    label: "Sermon"
    title: "Seeing Souls as God Sees Them"
    by: "Rev. Father Martin Sentman, CMRI"
    text: "Sermon for the 24th Sunday after Pentecost, Sunday, November 8, 2026, at Our Lady of the Most Holy Trinity Chapel."
    youtube: NGYm8lWSghI
    audio: /assets/audio/sermon-2026-11-08-sentman.mp3

  # The chapel's sermon for All Saints on its YouTube channel (uploaded 2026-11-19
  # through the YouTube pipeline; added here at the user's request the same day).
  - type: video
    wide: true
    label: "Sermon"
    title: "Called to Become Saints"
    by: "Rev. Father Adam Joseph Craig, CMRI"
    text: "Sermon for the Feast of All Saints, Sunday, November 1, 2026, at Our Lady of the Most Holy Trinity Chapel."
    youtube: cicsNVla_YQ
    audio: /assets/audio/sermon-2026-11-01-craig.mp3

  # The chapel's own video on its YouTube channel (added 2026-11-17 through the
  # YouTube pipeline, Church YouTube/PIPELINE.md, step 9).
  - type: video
    wide: true
    label: "Holy Latin Mass"
    title: "Feast of Christ the King"
    by: "Excerpt of the Holy Latin Mass offered by Rev. Father Brendan Hughes, CMRI"
    text: "Sunday, October 25, 2026, at Our Lady of the Most Holy Trinity Chapel, with singing by the Sacred Heart Singers."
    youtube: T1iqo-P0lz8

  # The sermon of that Holy Latin Mass, on the chapel's YouTube channel (added
  # 2026-11-19 through the YouTube pipeline, step 9).
  - type: video
    wide: true
    label: "Sermon"
    title: "The Kingship of Christ"
    by: "Rev. Father Brendan Hughes, CMRI"
    text: "Sermon for the Feast of Christ the King, Sunday, October 25, 2026, at Our Lady of the Most Holy Trinity Chapel."
    youtube: 6-WruuWnCNw
    audio: /assets/audio/sermon-2026-10-25-hughes.mp3

  - type: video
    wide: true
    label: "The Liturgical Year"
    title: "St. Felix of Valois (November 20)"
    by: "From Dom Guéranger's The Liturgical Year"
    text: "Video by the InPrincipio Podcast."
    youtube: ikm9kjy_c4A

  - type: link
    wide: true
    label: "CMRI Fatima Conference"
    title: "2026 Fatima Conference Recordings"
    text: "Watch the ten lectures, the keynote address, the Day of Recollection and the Pontifical Holy Latin Mass from the CMRI's 2026 Fatima Conference."
    url: https://cmri.org/about-cmri/fatima-apostolate/annual-fatima-conference/2026-fatima-conference-lectures-and-pontifical-high-mass/
    image: /assets/img/fatima.jpg
    image_alt: "The chapel's mural of Our Lady holding the Rosary and the Brown Scapular, crowned by the Most Holy Trinity"
    button: "Watch the recordings"
