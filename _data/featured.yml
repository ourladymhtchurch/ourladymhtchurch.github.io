# ---------------------------------------------------------------------------
# "Featured Content" cards on the home page, right after the Holy Latin Mass
# schedule. Cards appear in this order, two to a row.
#
# Sermons are on the Sermons page: add them to _data/sermons.yml, not here.
#
#   type: sermon  the chapel's most recent sermon video, taken from the top of
#                 videos: in _data/sermons.yml, with "Listen (MP3)" and
#                 "More sermons" buttons. Only label and wide are set here.
#   type: link    opens a web page. Needs url. image and button are optional.
#   type: video   a video that plays inside the card. Either a YouTube video:
#                 youtube (the id after "v=" in the address), with an optional
#                 start (in seconds); or a video file kept on this site: file
#                 (an .mp4 in assets/video/) and poster (a picture shown before
#                 it plays). GitHub refuses files over 100 MB, so keep each
#                 video file well under that. Add audio (an .mp3, in
#                 assets/audio/ or a web address) for a "Listen (MP3)" button
#                 under the video.
#   type: audio   an MP3 card (three to a row, after the others). Needs url.
#                 Sermons belong on the Sermons page instead (see above).
#
# wide: true makes a large card fill the whole row, picture or video on the left
# (useful when there is an odd number of large cards).
#
# On the site, always write "Holy Latin Mass", not "Mass" (see README.md).
# ---------------------------------------------------------------------------

items:
  # The chapel's most recent sermon: the first video in _data/sermons.yml.
  # Nothing to change here for a new sermon; add its video there instead.
  - type: sermon
    wide: true
    label: "Sermon"

  - type: video
    wide: true
    label: "The Liturgical Year"
    title: "St. Gertrude (November 16)"
    by: "From Dom Guéranger's The Liturgical Year"
    text: "Video by the InPrincipio Podcast."
    youtube: TkE7gtMWp9o

  - type: link
    wide: true
    label: "CMRI Fatima Conference"
    title: "2026 Fatima Conference Recordings"
    text: "Watch the ten lectures, the keynote address, the Day of Recollection and the Pontifical Holy Latin Mass from the CMRI's 2026 Fatima Conference."
    url: https://cmri.org/about-cmri/fatima-apostolate/annual-fatima-conference/2026-fatima-conference-lectures-and-pontifical-high-mass/
    image: /assets/img/fatima.jpg
    image_alt: "The chapel's mural of Our Lady holding the Rosary and the Brown Scapular, crowned by the Most Holy Trinity"
    button: "Watch the recordings"
