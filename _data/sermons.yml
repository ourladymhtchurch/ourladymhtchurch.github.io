# ---------------------------------------------------------------------------
# The Sermons page (/sermons/), linked from the ☰ menu and the row of links at
# the top of every page. Each group has a title, an optional description and its
# sermons, shown in this order, three to a row. Each sermon has:
#   title, by (who preached it), text (date or occasion), and
#   url: an .mp3 in assets/audio/ or a web address. It opens in a new tab.
#
# Put a new chapel sermon at the top of the first group. The sermon video on the
# home page is in _data/featured.yml (its MP3 is the "Listen (MP3)" button under
# the video). When a new video replaces it, add the old video's MP3 here.
#
# On the site, always write "Holy Latin Mass", not "Mass" (see README.md).
# ---------------------------------------------------------------------------

groups:
  - title: "Sermons at the Chapel"
    description: "Preached at Our Lady of the Most Holy Trinity Chapel, newest first."
    sermons:
      - title: "24th Sunday after Pentecost (Resumed Fifth Sunday after Epiphany)"
        by: "Father Martin Sentman, CMRI"
        text: "Sunday, November 8, 2026, at Our Lady of the Most Holy Trinity Chapel."
        url: /assets/audio/sermon-2026-11-08-sentman.mp3

      - title: "Feast of All Saints"
        by: "Father Adam Craig, CMRI"
        text: "Sunday, November 1, 2026."
        url: /assets/audio/sermon-2026-11-01-craig.mp3

      - title: "Feast of Christ the King"
        by: "Father Brendan Hughes, CMRI"
        text: "Sunday, October 25, 2026, at Our Lady of the Most Holy Trinity Chapel."
        url: /assets/audio/sermon-2026-10-25-hughes.mp3

  - title: "Sermons of the Saints"
    description: "Sermons by St. Alphonsus Maria de Liguori and St. John Marie Vianney, recorded by other websites."
    sermons:
      - title: "On the Death of the Just"
        by: "St. Alphonsus Maria de Liguori"
        text: "Sermon for the 25th Sunday after Pentecost (Resumed Sixth Sunday after Epiphany)"
        url: https://traditionalcatholicsermons.org/index_files/StAlphonsus_ForTheSixthSundayAfterEpiphany_OnTheDeathOfTheJust.mp3

      - title: "On Blasphemy"
        by: "St. Alphonsus Maria de Liguori"
        text: "Sermon for the 24th Sunday after Pentecost"
        url: https://traditionalcatholicsermons.org/index_files/StAlphonsus_TwentyFourthSundayAfterPentecost_OnBlasphemy.mp3

      - title: "On Impurity"
        by: "St. Alphonsus Maria de Liguori"
        text: "Sermon for the 16th Sunday after Pentecost"
        url: https://traditionalcatholicsermons.org/index_files/StAlphonsus_SixteenthSundayAfterPentecost_OnImpurity.mp3

      - title: "The Holy Family"
        by: "St. John Marie Vianney"
        text: "Family life in a disturbed and wavering condition; Example of the Holy Family; Threefold mission of the family"
        url: https://www.jmjsite.com/ars/14_3Epiphany_Holy_Family.mp3
