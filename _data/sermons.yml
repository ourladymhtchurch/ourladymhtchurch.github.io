# ---------------------------------------------------------------------------
# The Media page (/sermons/), "Media" in the ☰ menu and in the row of links at
# the top of every page. Its sections, in order: mass_videos, videos,
# video_groups, groups (below). The Media menus in _data/navigation.yml link to
# each section; update them when a section is added or renamed.
#
# mass_videos: the first section, "Holy Latin Mass and Excerpts": recordings of
# the Holy Latin Mass at the chapel, whole or in part, newest first, two to a
# row. Its title, description and videos are written like a video_groups entry
# (below). Add wide: true to a video to make it fill the row, and portrait: true
# to an MP4 filmed upright (a phone held vertically), which gets a tall frame.
#
# videos: the sermon videos, newest first. The FIRST one is shown large at the
# top of the Video Sermons section as the latest sermon, and also in Featured Content on
# the home page (the "type: sermon" card in _data/featured.yml). The others form
# the Video Sermon Archive under it, two to a row. Each video has:
#   title, by (who preached it), text (date and place), and either
#   file (an .mp4 in assets/video/) and poster (a picture in assets/img/ shown
#   before it plays), or youtube (the id after "v=" in the address) with an
#   optional start (in seconds). Add audio (an .mp3 in assets/audio/): the
#   latest sermon's card on the home page shows it as a "Listen (MP3)" button.
#   The video cards on this page have no MP3 button; put the MP3 in the
#   "Sermons at the Chapel" group below too.
# For a new sermon video, add it at the top of videos: and leave the older ones
# below it; they move into the archive by themselves. GitHub refuses files over
# 100 MB and the whole site must stay under 1 GB, so compress each video first.
#
# video_groups: more sections of videos, after the chapel's sermon videos, in
# this order, two to a row. Each section has a title, an optional description
# and its videos (newest first), written like the videos above, plus an
# optional label (the small word above the title, default "Sermon").
#
# groups: the MP3 sermons, in groups shown in this order, three to a row. Every
# chapel sermon MP3 goes in "Sermons at the Chapel", filmed or not. Each group has a title, an optional description and its
# sermons. Each sermon has title, by, text, and url: an .mp3 in assets/audio/ or
# a web address. It opens in a new tab. Put a new chapel sermon at the top of
# the first group.
#
# On the site, always write "Holy Latin Mass", not "Mass" (see README.md).
# ---------------------------------------------------------------------------

mass_videos:
