# ---------------------------------------------------------------------------
# "Devotions" cards on the home page, in this order. Each card has:
#   group:   the small label above the title (keep cards of one group together)
#   title:   the card heading
#   youtube: a YouTube video id (the part after "v="); the video plays in the card
#   image:   or, instead of a video, a picture (with image_alt describing it)
#   text:    optional. Markdown: **bold**, *italics*, [link text](https://address).
#            Leave a blank line between paragraphs.
#   wide:    true makes the card fill a whole row on computers, picture on the left
#            (good for a card with a long text)
# "intro" is the quotation shown under the section heading.
# ---------------------------------------------------------------------------

intro:
  text: "\"There has been no other name given under heaven, except the name of Jesus, by which we can be saved. God has laid no other foundation of our salvation, of our perfection, and of our glory, except Jesus Christ. [...] If, then, we establish the solid devotion to our Blessed Lady, it is only to establish more perfectly the devotion to Jesus Christ, and to put forward an easy and secure means for finding Jesus Christ\""
  attribution: "Treatise on True Devotion to the Blessed Virgin, De Montfort, 1863, p. 38"

items:
  - group: "The Holy Rosary"
    title: "The Importance of the Daily Rosary for Our Times"
    youtube: eWWGWhkJ8BQ
    text: |
      **Why the Battle of Lepanto is important for our times: Our Lady of Victory and the Battle of Lepanto**

      October 7th, Feast of the Most Holy Rosary of the Blessed Ever-Virgin Mary (Our Lady of Victory at Lepanto, 1571)

  - group: "The Holy Rosary"
