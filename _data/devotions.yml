  - group: "Our Lady"
    title: "True Devotion to Mary"
    youtube: dLBic3P1yLg
    text: "By St. Louis Marie de Montfort"

  - group: "Our Lady"
    title: "History of the Brown Scapular of Our Lady of Mount Carmel"
    youtube: cqBwFHaZV0w
    text: |
      **"Those who die wearing this scapular shall not suffer eternal fire!"** *(Our Lady to St. Simon Stock)*

      "Wear it devoutly and perseveringly; It is my garment. To be clothed in it means you are continually thinking of me, and I, in turn, am always thinking of you and helping you to secure eternal salvation."

  - group: "The Holy Face"
    title: "The 8 Promises of Jesus to Devotees of His Most Holy Face"
    youtube: NpObk_ItTkA
    text: |
      **An Aspiration to the Eternal Father to be Frequently Recited during the Day**

      Eternal Father, we offer Thee the Holy Face of Jesus, covered with blood, sweat, dust and spittle in reparation for the crimes of communists, blasphemers, and for the profaners of the Holy Name and of the Holy Day. Amen.

      Source: Scanlan, (2012). *The Golden Arrow*. TAN Books.

  - group: "Modesty and Purity"
    title: "Protect Purity with Modesty: The Pledge of Modesty"
    wide: true
    image: /assets/img/maria-bambina.jpg
    image_alt: "Statue of Santa Maria Bambina, the infant Mary, resting among white flowers before the altar"
    text: |
      **Our Blessed Ever-Virgin Queen Mother, The IMMACULATE CONCEPTION, Santa Maria Bambina, pray for us...**

      "I believe in the virtue of modesty as the guardian of chastity. I pledge myself to live and fight for the ideals of the virtue of purity and the observance of modesty. In particular, I pledge myself to live and fight for more decency in the printed and spoken word, and for a Mary-like modesty in dress and action. I promise also to set an example for my family and my associates, and to let others know where I stand in such matters, in the hope of leading them to greater purity of life. I hope to maintain these ideals by cultivating a strong personal devotion to the Sacred Heart of Jesus and to the Immaculate Heart of Mary."

      Amen +

      Source: [Archdiocese of Milwaukee, Decency and Modesty pastoral (PDF)](https://web.archive.org/web/20240405025427/https://www.archmil.org/ArchdioceseofMilwaukee/history/MC-021-B1-F15-Decency-and-Modesty-Pastoral.pdf)
