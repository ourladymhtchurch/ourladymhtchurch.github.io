intentions:
  - "Please pray: for a true Pope, for Bishop Pivarunas and the CMRI, for all Religious and Catholic Clergy including Bishop Davila and the SST, and please pray for more Holy Clergy and Religious Vocations, Third Order members, and Holy Catholic Marriages and Families."
  - "Please pray, especially the Holy Rosary daily for: an increase in the members and families of Our Lady of the Most Holy Trinity Chapel and that we all grow in grace and virtue, and eventually have a Catholic school soon. In addition, please pray for all the graces that we and our families need to become the saints that we are called to be, that we may have the grace of final perseverance, and for the conversion and sanctification of sinners, including the poor and the homeless, and the health of soul and body of the ill and dying, and the relief of the poor souls in Purgatory, especially the soul of + Rosa Esparza Macias, TOSF [09-04-1933 + 10-08-2026], and the relief of all our faithful departed relatives and friends."
  - "Please pray, especially the Holy Rosary daily for: true devotion to the Immaculate Heart of Mary for the reign of Jesus Christ the King over our cities, states, nation, and all nations, peoples, and leaders...+"

quotes:
  - text: "\"One day through the Rosary and Scapular, I will save the world.\" +"
    attribution: "Blessed Virgin Mary to Saint Dominic"
  - text: "\"Pray the Rosary daily... God wishes to establish in the world devotion to my Immaculate Heart. If people do what I tell you, many souls will be saved and there will be peace.\""
    attribution: "Our Lady of the Rosary to the three shepherd children (Lucia, Jacinta, and Francisco) during the apparitions in Fatima, Portugal in 1917"
