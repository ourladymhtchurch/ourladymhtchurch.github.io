---
layout: "default"
title: "Donation"
permalink: "/donation/"
description: "Support Our Lady of the Most Holy Trinity Chapel."
---
<section class="section">
  <div class="container">
    <div class="grid grid--6-6">
      <img src="{{ '/assets/img/donation-thanks.jpg' | relative_url }}" alt="Thank you for your charity! May Almighty God the Most Holy Trinity bless you...+">
      <div>
        <h1 class="content-heading">{{ site.chapel.legal_name }}</h1>
        <h2 class="heading-middle heading-middle--display">Donation</h2>
        {% comment %} PayPal donate button (hosted button from the chapel's PayPal account). {% endcomment %}
        <form class="paypal-donate" action="https://www.paypal.com/donate" method="post" target="_top">
          <input type="hidden" name="hosted_button_id" value="AYABM7BV2XAJ8">
          <input type="image" src="https://www.paypalobjects.com/en_US/i/btn/btn_donateCC_LG.gif" name="submit" title="PayPal - The safer, easier way to pay online!" alt="Donate with PayPal button">
          <img alt="" src="https://www.paypal.com/en_US/i/scr/pixel.gif" width="1" height="1">
        </form>
      </div>
    </div>
  </div>
</section>
